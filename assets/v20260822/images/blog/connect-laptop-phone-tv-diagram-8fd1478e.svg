<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Laptop and phone connection paths to a television</title>
  <desc id="desc">An original diagram showing a laptop connected to a television by cable and a phone connected wirelessly.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#2b3854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#13203a" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <circle cx="1080" cy="85" r="170" fill="#e32636" opacity="0.06"/>
  <circle cx="100" cy="610" r="210" fill="#1f6feb" opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="720" y="115" width="390" height="315" rx="24" fill="#121826"/>
    <rect x="742" y="137" width="346" height="260" rx="12" fill="url(#screen)"/>
    <path d="M860 430h110l16 52H844z" fill="#2e3647"/>
    <rect x="812" y="477" width="206" height="18" rx="9" fill="#121826"/>
    <path d="M820 252l54-42 53 35 75-68 52 40" fill="none" stroke="#f7fbff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>
    <circle cx="820" cy="252" r="12" fill="#e32636"/>
    <circle cx="1054" cy="217" r="12" fill="#1f9d68"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="105" y="165" width="385" height="235" rx="18" fill="#20293a"/>
    <rect x="126" y="186" width="343" height="190" rx="9" fill="url(#screen)"/>
    <path d="M72 410h452l-38 58H110z" fill="#39465b"/>
    <rect x="241" y="426" width="112" height="10" rx="5" fill="#9aa7ba"/>
    <rect x="206" y="250" width="184" height="64" rx="14" fill="#ffffff" opacity="0.94"/>
    <text x="298" y="291" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">LAPTOP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="535" y="363" width="105" height="205" rx="25" fill="#171e2d"/>
    <rect x="546" y="386" width="83" height="151" rx="14" fill="url(#screen)"/>
    <circle cx="587" cy="551" r="7" fill="#8996aa"/>
    <path d="M556 466h62M556 487h62M556 508h44" stroke="#f8fbff" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  </g>

  <path d="M500 310C615 310 626 360 720 360" fill="none" stroke="#e32636" stroke-width="14" stroke-linecap="round"/>
  <rect x="603" y="312" width="90" height="56" rx="13" fill="#ffffff" stroke="#d6dde8" stroke-width="4"/>
  <rect x="626" y="329" width="44" height="22" rx="4" fill="#2c374a"/>
  <text x="595" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#b61d2a">WIRED</text>

  <path d="M650 405c52-48 101-60 151-41" fill="none" stroke="#1f6feb" stroke-width="10" stroke-linecap="round"/>
  <path d="M672 430c37-32 72-39 108-26" fill="none" stroke="#1f6feb" stroke-width="9" stroke-linecap="round" opacity="0.8"/>
  <path d="M693 454c22-17 43-21 64-13" fill="none" stroke="#1f6feb" stroke-width="8" stroke-linecap="round" opacity="0.65"/>
  <text x="735" y="520" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1858b0">WIRELESS</text>

  <rect x="326" y="585" width="548" height="54" rx="27" fill="#ffffff" opacity="0.92"/>
  <text x="600" y="620" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#26344b">CHECK PORTS • PICTURE • SOUND</text>
</svg>
